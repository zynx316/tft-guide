<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5"
        media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#818cf8"
        media="(prefers-color-scheme: dark)">
  <meta name="description"
        content="Ordner – dein persönlicher Organizer. Termine, Aufgaben, Notizen und Kontakte – alles offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ordner">

  <title>Ordner</title>

  <!-- PWA-Manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Design-System -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- App-Wurzelelement (wird von app.js befüllt) -->
  <div id="app-root"></div>

  <!-- App-Shell als ES-Modul -->
  <script type="module" src="js/app.js"></script>

  <!-- Service Worker registrieren -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.warn('[SW] Registrierung fehlgeschlagen:', err);
        });
      });
    }
  </script>
</body>
</html>
